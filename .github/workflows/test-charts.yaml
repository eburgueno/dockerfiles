name: Lint and Test Charts

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/test-charts.yaml"
      - ".github/ct-lint.yaml"
      - ".github/ct-install.yaml"
  push:
    paths:
      - "charts/**"
      - ".github/workflows/test-charts.yaml"
      - ".github/ct-lint.yaml"
      - ".github/ct-install.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-chart:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect-changed.outputs.matrix }}
      has_changes: ${{ steps.detect-changed.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v3.16.4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.3.1

      - name: Detect changed charts
        id: detect-changed
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: |
          changed="$(ct list-changed --config .github/ct-lint.yaml --target-branch "${TARGET_BRANCH}")"
          if [[ -z "${changed}" ]]; then
            echo 'matrix=[]' >> "${GITHUB_OUTPUT}"
            echo 'has_changes=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          matrix="$(printf '%s\n' "${changed}" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo 'has_changes=true' >> "${GITHUB_OUTPUT}"

      - name: Run chart-testing (lint)
        if: steps.detect-changed.outputs.has_changes == 'true'
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: ct lint --config .github/ct-lint.yaml --target-branch "${TARGET_BRANCH}"

  install-chart:
    name: install-chart
    runs-on: ubuntu-latest
    needs:
      - lint-chart
    if: needs.lint-chart.outputs.has_changes == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create kind cluster
        uses: helm/kind-action@v1.4.0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.3.1

      - name: Run chart-testing (install)
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: ct install --config .github/ct-install.yaml --target-branch "${TARGET_BRANCH}"
